version: '3.9'

# NOTE: PostgreSQL is no longer included — Supabase is cloud-hosted.
# This compose file starts: Node.js backend + Redis + Nginx + Frontend

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devspace_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - devspace_net
    volumes:
      - backend_logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${CLIENT_URL:-http://localhost}/api
        REACT_APP_WS_URL: ${CLIENT_URL:-http://localhost}
    container_name: devspace_frontend
    restart: unless-stopped
    networks:
      - devspace_net

  nginx:
    image: nginx:1.25-alpine
    container_name: devspace_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - devspace_net

  redis:
    image: redis:7-alpine
    container_name: devspace_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devspace_net

volumes:
  redis_data:
  backend_logs:

networks:
  devspace_net:
    driver: bridge
